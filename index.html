<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#081322"><title>Biostatistics Essay | Abdelrahman Ashraf</title><style>
:root{--gold:#e9bb60;--bg:#071321;--ink:#eaf0f8}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0%,#1b344b 0%,#071321 60%);color:var(--ink);font-family:system-ui,'Segoe UI',Arial,sans-serif}.wrap{max-width:850px;margin:auto;padding:18px}.hero{border:1px solid #806638;border-radius:24px;overflow:hidden;box-shadow:0 12px 55px #0007;background:#0d1b2b}.hero img{width:100%;height:auto;object-fit:contain;display:block}.herotext{text-align:center;padding:20px}.kicker{letter-spacing:3px;color:var(--gold);font-size:12px;font-weight:800}.hero h1{font-size:clamp(25px,5vw,39px);margin:8px 0;color:#f8d889}.hero h2{font-size:clamp(17px,3vw,25px);margin:6px 0}.hero p{color:#aebdca;margin:8px 0}.panel{margin:20px 0;background:#0e2032;border:1px solid #31465b;border-radius:20px;padding:22px}.panel h3{color:var(--gold);margin:0 0 10px}.muted{color:#adbfce;font-size:14px}.field,textarea{width:100%;background:#071626;color:#fff;border:1px solid #536578;border-radius:12px;padding:14px;font:inherit;outline:none}.field:focus,textarea:focus{border-color:var(--gold)}textarea{resize:vertical;min-height:125px}.question{padding:20px 0;border-bottom:1px solid #334659}.question:last-child{border:0}.qhead{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}.num{background:linear-gradient(120deg,#d49b39,#f6d78c);color:#0c1722;border-radius:10px;min-width:37px;height:37px;display:grid;place-items:center;font-weight:900}.qhead strong{font-size:16px;line-height:1.55}button{background:linear-gradient(115deg,#c99843,#ffe0a0);border:0;border-radius:14px;padding:17px 20px;width:100%;font-size:17px;font-weight:800;color:#071321;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.status{text-align:center;margin-top:15px;font-weight:700}.foot{text-align:center;color:#9baebd;font-size:13px;margin:30px 0}label{display:block;margin:12px 0 7px;font-weight:700}@media(max-width:500px){.wrap{padding:10px}.hero img{height:230px}.panel{padding:15px}.question{padding:17px 0}}</style></head><body><main class="wrap"><header class="hero"><img src="poster.png" alt="Abdelrahman Ashraf Biostatistics poster"><div class="herotext"><div class="kicker">VETERINARY MEDICINE • LECTURE 01</div><h1>Biostatistics – Essay Exam</h1><h2 lang="ar" dir="rtl">عبدالرحمن أشرف محمد</h2><p>Abdelrahman Ashraf Mohamed</p><p>Answer each question in your own words.</p></div></header><form id="exam"><section class="panel"><h3>Student details</h3><label for="student">Your name</label><input class="field" id="student" name="student" required maxlength="100" placeholder="Enter your name"><p class="muted">Your answers will be sent privately to the exam organizer.</p></section><section class="panel"><h3>Essay Questions <span id="count"></span></h3><div id="questions"></div></section><section class="panel"><button id="submit" type="submit">Submit All Answers ✦</button><div class="status" id="status" role="status" aria-live="polite"></div></section></form><div class="foot">Created by Abdelrahman Ashraf Mohamed © 2026</div></main><script>
const QUESTIONS=["What is studying biostatistics useful for?", "Enumerate the two main types of statistical applications and explain each briefly.", "What are the two main sources of data?", "Enumerate the four types of measurement scales.", "Enumerate the main sampling techniques.", "Explain the stratified sampling method and its main steps.", "Classify data and variables into their main types, with examples.", "What are the main types of distributions? Explain symmetrical and skewed distributions.", "Differentiate between the null hypothesis (H₀) and the alternative hypothesis (Hₐ).", "Differentiate between Type I and Type II errors."];
// Paste your deployed Google Apps Script Web App URL below:
const GOOGLE_SCRIPT_URL='PASTE_YOUR_GOOGLE_APPS_SCRIPT_URL_HERE';
const area=document.getElementById('questions');document.getElementById('count').textContent=`(${QUESTIONS.length})`;
QUESTIONS.forEach((q,i)=>{let item=document.createElement('div');item.className='question';let head=document.createElement('div');head.className='qhead';let n=document.createElement('span');n.className='num';n.textContent=i+1;let title=document.createElement('strong');title.textContent=q;head.append(n,title);let answer=document.createElement('textarea');answer.name='q'+(i+1);answer.required=true;answer.placeholder='Write your answer here...';answer.setAttribute('aria-label','Answer to question '+(i+1));item.append(head,answer);area.append(item)});
document.getElementById('exam').addEventListener('submit',async e=>{e.preventDefault();const status=document.getElementById('status');if(!GOOGLE_SCRIPT_URL.startsWith('https://script.google.com/macros/s/')){status.textContent='The organizer needs to connect the answer sheet before submissions can be accepted.';status.style.color='#ffd18a';return}const button=document.getElementById('submit');button.disabled=true;status.textContent='Sending answers…';status.style.color='#fff';const answers=QUESTIONS.map((q,i)=>({question:q,answer:document.querySelector('[name="q'+(i+1)+'"]').value.trim()}));const data={student:document.getElementById('student').value.trim(),answers};try{await fetch(GOOGLE_SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(data)});status.textContent='Submission sent. Please check with the organizer if confirmation is needed.';status.style.color='#b7f0c4';button.textContent='Sent';}catch(err){status.textContent='Could not send. Check your connection and try again.';status.style.color='#ffb6b6';button.disabled=false}});
</script></body></html>
